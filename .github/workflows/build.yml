name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Find projects
        run: |
          find . -name "*.xcodeproj"
          find . -name "*.xcworkspace"

      - name: Build Box2D first
        run: |
          xcodebuild \
            -project Smeshario_iOS.xcodeproj \
            -target Box2D \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build
        run: |
          xcodebuild \
            -project Smeshario_iOS.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      
      - name: Copy font
        run: |
          cp Resources/Fonts/Smeshariki2007Fixed-Regular.ttf build/Release-iphoneos/Smeshario_iOS.app/

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/Smeshario_iOS.app Payload
          zip -r Smeshario_iOS.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Smeshario-IPA
          path: Smeshario_iOS.ipa
