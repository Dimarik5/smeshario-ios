name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Find projects
        run: |
          find . -name "*.xcodeproj"
          find . -name "*.xcworkspace"
      
      - name: Build Box2D first
        run: |
          xcodebuild \
            -project smeshario_demo_for_ios.xcodeproj \
            -target Box2D \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      
      - name: Build
        run: |
          xcodebuild \
            -project Smeshario_demo_for_ios.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      
      - name: Show build output
        run: |
          echo "=== Build directory ==="
          find build -maxdepth 3
      
          echo
          echo "=== Looking for .app ==="
          find . -name "*.app"
      
          echo
          echo "=== Looking for .ipa ==="
          find . -name "*.ipa"

      - name: Create IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/smeshario_demo_for_ios.app Payload
          zip -r smeshario_demo_for_ios.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Smeshario-IPA
          path: smeshario_demo_for_ios.ipa
